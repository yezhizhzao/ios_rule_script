[rewrite_local]
# 单条规则覆盖 po.bzgteam.cn 全部请求；脚本内部按 URL 分流（抓取 / 取回）。
# 脚本来源二选一：
#   A) 本地资源库（推荐，仿照你可用的 rapa_sync.js）：先把 bzg_token_v9.js 通过
#      QX「引用资源 → 脚本」加入资源库，再用裸文件名引用（如下）。
#   B) 公网 raw（你之前已验证能下载）：把下面整行换成
#      ^https?://po\.bzgteam\.cn/ url script-request-header https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_token_v9.js
^https?://po\.bzgteam\.cn/ url script-request-header bzg_token_v9.js

[mitm]
hostname = po.bzgteam.cn
