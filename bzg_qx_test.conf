[rewrite_local]
# 最小测试配置（响应阶段版）：一条规则同时抓 token + 弹通知。
# 关键点：必须用 script-response-header，绝不能用 script-request-header 弹通知
#        （请求阶段弹通知会卡住 $done，导致小程序网络异常、进不去菜单）。
# 用法：
#   方式A（公网）：先把 bzg_test_notify.js 上传 GitHub，下面用你的 raw 地址
#   方式B（资源库）：用 QX「引用资源 → 脚本」加入该文件后，改成裸文件名 bzg_test_notify.js
^https?://po\.bzgteam\.cn/ url script-response-header https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_test_notify.js

[mitm]
hostname = po.bzgteam.cn
