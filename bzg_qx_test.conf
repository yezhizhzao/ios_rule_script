[rewrite_local]
# 最小测试配置：只跑 bzg_test_notify.js，验证 QX 能跑脚本并弹通知。
# 用法：临时把 QX 重写配置换成这个（或新增一条规则），打开煲珠公小程序，
#       若弹出“BZG·TEST”说明通道正常；什么都不弹说明脚本没加载或通知被禁。
# 方式A（公网）：把下面的 URL 换成你上传 bzg_test_notify.js 后的 raw 地址
# 方式B（资源库）：用 QX「引用资源 → 脚本」加入该文件后，改成裸文件名 bzg_test_notify.js
^https?://po\.bzgteam\.cn/ url script-request-header https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_test_notify.js

[mitm]
hostname = po.bzgteam.cn
