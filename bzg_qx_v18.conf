[rewrite_local]
# 煲珠公 token 抓取（v18，纯本地，无 GitHub/无服务器）
#
# ⚠️ 只保留这两条规则，删除其他所有旧规则。
# 设计：请求阶段只抓取（$done({}) 放行），响应阶段只弹通知（$done({}) 放行）。
#       两个阶段都不做任何改写——本机 QX 响应改写会挂死（body/header/mock 均已实测证伪）。
#
# 规则1：请求阶段抓取 M-Access-Token 存入 $prefs
^https?://po\.bzgteam\.cn/ url script-request-header bzg_cap_v18.js
# 规则2：响应阶段弹通知（token 变化且距上次 >60s；点通知带 token 唤起 Scriptable）
^https?://po\.bzgteam\.cn/ url script-response-header bzg_cap_v18.js

[mitm]
hostname = po.bzgteam.cn
