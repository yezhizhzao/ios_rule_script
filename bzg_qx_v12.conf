# 煲珠公 Token 抓取配置 v12（Quantumult X）
# 用法：
#   1) 把 bzg_cap_v12.js 加入 QX「引用资源 → 脚本」（或用下面的 raw URL）。
#   2) 把下面的 <裸文件名> 改成你的资源库文件名；若走 GitHub raw，改成完整 raw URL：
#      https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_cap_v12.js
#   3) 确认 QX「重写」开关开、MitM 里 hostname=po.bzgteam.cn 已启用。
#   4) 打开煲珠公小程序点进一家店 → 弹「BZG·抓到 Token」，点通知即自动在 Scriptable 查询。

[rewrite_local]
^https?://po\.bzgteam\.cn/ url script-response-header https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_cap_v12.js

[mitm]
hostname = po.bzgteam.cn
