[rewrite_local]
# 煲珠公 token 抓取（纯本地 v15，无 GitHub/无服务器）
# 把 bzg_cap_v15.js 加入 QX「引用资源 → 脚本」后，下面用裸文件名即可；
# 若走 GitHub raw，把文件名换成完整 raw URL。

# ① 桥接（请求阶段短路，最稳）：Scriptable 请求此路径时，QX 直接在请求阶段返回已抓到的 token
#    —— 和你验证过的 302 拦截是同一机制（script-request-header），不依赖服务器往返/响应体改写
^https?://po\.bzgteam\.cn/__bzg_token__ url script-request-header bzg_cap_v15.js

# ② 抓取：小程序请求在响应阶段抓 M-Access-Token 并存起来（供桥接返回）
^https?://po\.bzgteam\.cn/ url script-response-header bzg_cap_v15.js

[mitm]
hostname = po.bzgteam.cn
