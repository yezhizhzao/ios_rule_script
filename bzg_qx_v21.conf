[rewrite_local]
# 煲珠公 token 抓取 + 活动通知（v21，纯本地，无 GitHub/无服务器）
#
# ⚠️ 只保留这两条 bzg 规则，删除其他旧 bzg 规则。
#
# 核心修正：服务器不校验 JWT exp → 小程序永远复用同一 token（不重新登录）
#   → 通知触发改为「活动触发」：小程序发请求（UA 含 MicroMessenger）且距上次通知 >3 分钟
#   → 打开小程序点门店即弹通知（最多 3 分钟一条，不会刷屏）
#
# 规则1：请求阶段抓取 + 活动标记
^https?://po\.bzgteam\.cn/ url script-request-header bzg_cap_v21.js
# 规则2：响应阶段兜底捕获 + 通知
^https?://po\.bzgteam\.cn/ url script-response-header bzg_cap_v21.js

[mitm]
hostname = po.bzgteam.cn
