[rewrite_local]
# 煲珠公 token 抓取 + 活动通知（v22，纯本地，无 GitHub/无服务器）
#
# ⚠️ 只保留这两条 bzg 规则，删除其他旧 bzg 规则。
#
# v22 修正：$notify 第 4 参必须用对象形式 {'url':...,'open-url':...}
#   （传纯字符串 URL 时 QX 静默不弹通知；对象形式实测可弹且可跳转）
# 通知触发：活动触发（服务器不校验 JWT exp → token 永不变），小程序请求 + >3 分钟间隔 → 弹一条。
#
# 规则1：请求阶段抓取 + 活动标记
^https?://po\.bzgteam\.cn/ url script-request-header bzg_cap_v22.js
# 规则2：响应阶段兜底捕获 + 通知
^https?://po\.bzgteam\.cn/ url script-response-header bzg_cap_v22.js

[mitm]
hostname = po.bzgteam.cn