# 煲珠公 Token 抓取 QX 配置 v14（GitHub txt 中转，无服务器）
# 用法：QX → 重写 → 引入本配置（或手动建同款规则）。
# 若走 GitHub raw：把下面 bzg_cap_v14.js 换成完整 raw URL；
# 若已加入 QX「引用资源→脚本」资源库：保留裸文件名。
#
# ⚠️ 部署前请把 v10/v11/v12/v13 的旧重写规则全部禁用或删除。

[rewrite_local]
^https\://po\.bzgteam\.cn/ url script-response-header https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_cap_v14.js

[mitm]
hostname = po.bzgteam.cn
