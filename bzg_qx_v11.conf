[rewrite_local]
# 煲珠公 token：请求阶段抓取，响应阶段弹通知（同一份脚本，两个规则）
# 先把 bzg_token_v11.js 上传到你的 GitHub，再把下面两行的 URL 换成你的 raw 地址。
# 不想用公网也可：把 bzg_token_v11.js 通过 QX「引用资源 → 脚本」加入，然后把下面两行换成裸文件名 bzg_token_v11.js
^https?://po\.bzgteam\.cn/ url script-request-header https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_token_v11.js
^https?://po\.bzgteam\.cn/ url script-response-header https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_token_v11.js

[mitm]
hostname = po.bzgteam.cn
