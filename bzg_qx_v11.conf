[rewrite_local]
# 煲珠公 token：请求阶段抓取 + 响应阶段弹通知（两个独立脚本）
# 方式A（公网）：先把 bzg_cap_v11.js / bzg_note_v11.js 上传 GitHub，把下面两行换成你的 raw 地址
# 方式B（资源库）：用 QX「引用资源 → 脚本」加入这两个文件，然后把下面两行换成裸文件名 bzg_cap_v11.js / bzg_note_v11.js
^https?://po\.bzgteam\.cn/ url script-request-header https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_cap_v11.js
^https?://po\.bzgteam\.cn/ url script-response-header https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_note_v11.js

[mitm]
hostname = po.bzgteam.cn
