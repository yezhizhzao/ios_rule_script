[rewrite_local]
# 煲珠公 token 抓取 + 桥接（v15d，纯本地，无 GitHub/无服务器）
#
# ★ 与 v15c 的区别：删除了「请求阶段桥接」规则！
#   实测证明：script-request-header 里用 $done({response:{...}}) mock 响应
#   在真机上会把请求挂起 → Scriptable 报「请求超时」。
#
# v15d 原理（只留一条响应阶段规则，语法是 QX 官方且实测可用的裸对象改写）：
#   - 小程序正常请求 → 抓 M-Access-Token 存起来
#   - Scriptable 请求 /__bzg_token__ → 放行到真实服务器（nginx 秒回 404），
#     响应阶段脚本把该 404 响应整体改写成 token（status 200 + body=token）返回
#
# bzg_cap_v15c.js 加入 QX「引用资源 → 脚本」后用裸文件名；走 GitHub raw 则换成完整 raw URL。
^https?://po\.bzgteam\.cn/ url script-response-header bzg_cap_v15c.js

[mitm]
hostname = po.bzgteam.cn
