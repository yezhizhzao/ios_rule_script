[rewrite_local]
# 抓取小程序发往 po.bzgteam.cn 的请求，从中提取 M-Access-Token，并 POST 到局域网中转。
# 脚本来源二选一：
#   A) 本地资源库（推荐，避免网络缓存）：先把 bzg_token_v10.js 通过 QX「引用资源 → 脚本」加入资源库，再用裸文件名。
#   B) 公网 raw：替换为 https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_token_v10.js
^https?://po\.bzgteam\.cn/ url script-request-header https://raw.githubusercontent.com/yezhizhzao/ios_rule_script/refs/heads/master/bzg_token_v10.js

[mitm]
hostname = po.bzgteam.cn
