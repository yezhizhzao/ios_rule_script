[rewrite_local]
# 煲珠公 token 抓取（v19，纯本地，无 GitHub/无服务器）
#
# ⚠️ 只保留这两条 bzg 规则，删除其他旧 bzg 规则。
# v19 = v18 + 响应体兜底捕获（登录响应体里直接抓 JWT，解决小程序重开不重新登录的问题）。
#   请求阶段：抓请求头 M-Access-Token；响应阶段：扫响应体 JWT + 发挂起的通知。
#   全程零改写（本机 QX 响应改写会挂死）。
#
# 规则1：请求阶段抓取
^https?://po\.bzgteam\.cn/ url script-request-header bzg_cap_v19.js
# 规则2：响应阶段（兜底捕获 + 通知）
^https?://po\.bzgteam\.cn/ url script-response-header bzg_cap_v19.js

[mitm]
hostname = po.bzgteam.cn
