[rewrite_local]
# 煲珠公 token 抓取 + 桥接（v16，纯本地，无 GitHub/无服务器）
#
# ⚠️ 重要：请把 v8~v15 的所有旧重写规则全部删除，只保留这一条！
#   残留的旧 script-request-header 规则会把 Scriptable 的取 token 请求扣住不放，
#   造成「请求超时」——这是 v15c/v15d 一直超时的头号嫌疑。
#
# 仅一条响应阶段规则（真机验证过唯一可靠的阶段 + 裸对象改写语法）：
#   - 小程序正常请求 → 抓 M-Access-Token 存起来并弹通知（仅变化时，60s 节流）
#   - Scriptable 请求 /__bzg_token__ → 把该响应整体改写成 token 返回
#     （http 和 https 都覆盖：http 不经 MitM，绕开解密环节的干扰）
^https?://po\.bzgteam\.cn/ url script-response-header bzg_cap_v16.js

[mitm]
hostname = po.bzgteam.cn
