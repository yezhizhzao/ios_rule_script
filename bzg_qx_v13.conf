# 煲珠公 Token 抓取 QX 配置 v13（无中转服务器版）
# 用法：QX → 重写 → 引入本配置（或手动建同款规则）。
# 若走 GitHub raw：把下面两处 bzg_cap_v13.js 换成完整 raw URL；
# 若已加入 QX「引用资源→脚本」资源库：保留裸文件名即可。
#
# ⚠️ 部署本版前，请把之前 v10/v11/v12/test 的旧规则全部禁用或删除，
#    否则旧脚本会继续弹重复通知、干扰本版。

[rewrite_local]
^https\://po\.bzgteam\.cn/ url script-response-header bzg_cap_v13.js

[mitm]
hostname = po.bzgteam.cn
