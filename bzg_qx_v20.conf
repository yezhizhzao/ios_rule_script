[rewrite_local]
# 煲珠公 token 抓取（v20，纯本地，无 GitHub/无服务器）
#
# ⚠️ 只保留这两条 bzg 规则，删除其他旧 bzg 规则。
# v20：三路捕获（请求头/响应阶段请求头/响应体 JWT）+ 双阶段独立诊断。
#   诊断：bzg_read.js 读 bzg_diag_req 和 bzg_diag_resp——
#     req 时间戳在动 = 请求阶段规则在跑；resp 时间戳在动 = 响应阶段规则在跑。
#   全程零改写（本机 QX 响应改写会挂死）。
#
# 规则1：请求阶段抓取 + 诊断
^https?://po\.bzgteam\.cn/ url script-request-header bzg_cap_v20.js
# 规则2：响应阶段捕获 + 通知 + 诊断
^https?://po\.bzgteam\.cn/ url script-response-header bzg_cap_v20.js

[mitm]
hostname = po.bzgteam.cn
