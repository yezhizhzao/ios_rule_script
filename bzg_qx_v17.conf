[rewrite_local]
# 煲珠公 token 抓取 + 桥接（v17，纯本地，无 GitHub/无服务器）
#
# ⚠️ 删除 v8~v16 所有旧规则，只保留这一条。
#
# 仅一条响应阶段规则：
#   - 小程序正常请求 → 抓 M-Access-Token + 通知（点通知带 token 唤起 Scriptable）
#   - Scriptable 请求 /__bzg_token__ → 只注入响应头 X-BZG-Token（不改写 body，
#     实测本机 QX 改写响应体会挂死；header 注入不触碰 body，规避该问题）
^https?://po\.bzgteam\.cn/ url script-response-header bzg_cap_v17.js

[mitm]
hostname = po.bzgteam.cn
