[rewrite_local]
# 煲珠公 token 抓取 + 桥接（v15c，纯本地，无 GitHub/无服务器）
# bzg_cap_v15c.js 加入 QX「引用资源 → 脚本」后用裸文件名；走 GitHub raw 则换成完整 raw URL。
#
# 规则1：请求阶段桥接 —— Scriptable 请求 /__bzg_token__ 时，
#        QX 在请求阶段直接 mock 返回 token（不依赖真实服务器往返，最可靠）
^https?://po\.bzgteam\.cn/__bzg_token__ url script-request-header bzg_cap_v15c.js
#
# 规则2：响应阶段 —— 小程序正常请求抓 M-Access-Token；
#        若桥接请求漏过规则1，也在响应阶段把响应体替换成 token（双保险）
^https?://po\.bzgteam\.cn/ url script-response-header bzg_cap_v15c.js

[mitm]
hostname = po.bzgteam.cn
